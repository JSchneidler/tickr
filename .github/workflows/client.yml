name: Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "bun.lock"
      - "package.json"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun run build
