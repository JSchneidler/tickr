name: Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/server.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cp .env.example .env
      - run: bun install --frozen-lockfile
      - run: bun db:migrate
      - run: bun lint
      - run: bun run build
      - run: bun run test
